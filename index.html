<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الشاشات - Index</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* شريط التنقل العلوي */
        header {
            background-color: #1e293b;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.2rem;
        }

        nav button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 8px 14px;
            margin-right: 5px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        nav button:hover {
            background-color: #2563eb;
        }

        /* حاوية الشاشات */
        .container {
            flex: 1;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* تنسيق الشاشة العامة */
        .screen {
            display: none; /* إخفاء الشاشات افتراضياً */
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* الشاشة النشطة فقط تظهر */
        .screen.active {
            display: block;
        }

        h2 {
            margin-bottom: 20px;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        /* تنسيق النماذج المدخلة */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
        }

        .btn-submit {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #059669;
        }

        /* كروت شاشة التحكم */
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .card h3 {
            font-size: 2rem;
            color: #3b82f6;
            margin-top: 10px;
        }

        /* جدول المبيعات */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table, th, td {
            border: 1px solid #e2e8f0;
        }

        th, td {
            padding: 12px;
            text-align: right;
        }

        th {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body>

    <!-- شريط القائمة الرئيسي التنقلي -->
    <header>
        <h1>نظام الإدارة (Index)</h1>
        <nav>
            <button onclick="showScreen('signup-screen')">إنشاء حساب</button>
            <button onclick="showScreen('dashboard-screen')">لوحة التحكم</button>
            <button onclick="showScreen('sales-screen')">المبيعات</button>
        </nav>
    </header>

    <div class="container">

        <!-- 1. شاشة إنشاء حساب -->
        <div id="signup-screen" class="screen active">
            <h2>شاشة إنشاء حساب</h2>
            <form onsubmit="alert('تم إنشاء الحساب بنجاح!'); return false;">
                <div class="form-group">
                    <label>الاسم الكامل:</label>
                    <input type="text" placeholder="أدخل اسمك" required>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني:</label>
                    <input type="email" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label>كلمة السر:</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">تسجيل الحساب</button>
            </form>
        </div>

        <!-- 2. شاشة التحكم -->
        <div id="dashboard-screen" class="screen">
            <h2>شاشة التحكم (Dashboard)</h2>
            <div class="dashboard-cards">
                <div class="card">
                    <p>إجمالي المستخدِمين</p>
                    <h3>124</h3>
                </div>
                <div class="card">
                    <p>المبيعات اليومية</p>
                    <h3>$1,250</h3>
                </div>
                <div class="card">
                    <p>الطلبات الجديدة</p>
                    <h3>18</h3>
                </div>
            </div>
        </div>

        <!-- 3. شاشة المبيعات -->
        <div id="sales-screen" class="screen">
            <h2>شاشة المبيعات</h2>
            <table>
                <thead>
                    <tr>
                        <th>رقم العملية</th>
                        <th>المنتج</th>
                        <th>السعر</th>
                        <th>التاريخ</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>#1001</td>
                        <td>منتج A</td>
                        <td>$150</td>
                        <td>2026-07-26</td>
                    </tr>
                    <tr>
                        <td>#1002</td>
                        <td>منتج B</td>
                        <td>$300</td>
                        <td>2026-07-25</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- كود الجافاسكربت للتنقل بين الشاشات -->
    <script>
        function showScreen(screenId) {
            // إخفاء جميع الشاشات
            const screens = document.querySelectorAll('.screen');
            screens.forEach(screen => {
                screen.classList.remove('active');
            });

            // إظهار الشاشة المطلوبة فقط
            const selectedScreen = document.getElementById(screenId);
            if (selectedScreen) {
                selectedScreen.classList.add('active');
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق النظام - Index</title>
  
  <style>
    /* تنسيقات عامة */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f0f2f5;
      text-align: center;
    }

    /* شريط التنقل */
    .navbar {
      background-color: #1e293b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .navbar button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      background-color: #3b82f6;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    .navbar button:hover {
      background-color: #2563eb;
    }

    /* الشاشات */
    .screen {
      display: none;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      margin: 0 auto;
    }

    /* إظهار الشاشة النشطة */
    .screen.active {
      display: block;
    }

    /* تنسيقات بسيطة للمدخلات داخل الشاشات */
    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .btn-submit {
      background-color: #10b981;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- شريط الانتقال بين الشاشات -->
  <nav class="navbar">
    <button onclick="showScreen('signup')">إنشاء حساب</button>
    <button onclick="showScreen('dashboard')">شاشة التحكم</button>
    <button onclick="showScreen('sales')">شاشة المبيعات</button>
  </nav>

  <!-- 1. شاشة إنشاء حساب -->
  <div id="signup" class="screen active">
    <h2>👤 شاشة إنشاء حساب</h2>
    <form onsubmit="event.preventDefault();">
      <input type="text" placeholder="الاسم كامل" required><br>
      <input type="email" placeholder="البريد الإلكتروني" required><br>
      <input type="password" placeholder="كلمة السر" required><br>
      <button class="btn-submit">تسجيل حساب جديد</button>
    </form>
  </div>

  <!-- 2. شاشة التحكم -->
  <div id="dashboard" class="screen">
    <h2>⚙️ شاشة التحكم</h2>
    <p>أهلاً بك في لوحة التحكم الخاصة النظام.</p>
    <div style="background: #e2e8f0; padding: 15px; border-radius: 8px; margin-top: 15px;">
      <p>📊 **إحصائيات سريعة:**</p>
      <p>عدد المستخدمين: 25</p>
      <p>الحالة: نشط</p>
    </div>
  </div>

  <!-- 3. شاشة المبيعات -->
  <div id="sales" class="screen">
    <h2>🛒 شاشة المبيعات</h2>
    <p>إدارة العمليات والفواتير:</p>
    <form onsubmit="event.preventDefault();">
      <input type="text" placeholder="اسم المنتج"><br>
      <input type="number" placeholder="السعر"><br>
      <button class="btn-submit" style="background-color: #f59e0b;">إضافة عملية بيع</button>
    </form>
  </div>

  <!-- كود التبديل بين الشاشات -->
  <script>
    function showScreen(screenId) {
      // إخفاء كل الشاشات
      const screens = document.querySelectorAll('.screen');
      screens.forEach(screen => {
        screen.classList.remove('active');
      });

      // إظهار الشاشة المحددة
      const targetScreen = document.getElementById(screenId);
      if (targetScreen) {
        targetScreen.classList.add('active');
      }
    }
  </script>

</body>
</html>
